spring.application.name = api-gateway

server.port = 8765
eureka.instance.hostname = localhost
eureka.instance.prefer-ip-address = true

eureka.client.register-with-eureka = true
eureka.client.fetch-registry = true

spring.cloud.gateway.server.webflux.discovery.locator.enabled = true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id = true

jwt.secret = ${JWT_SECRET}

spring.cloud.gateway.server.webflux.routes[0].id = authservice
spring.cloud.gateway.server.webflux.routes[0].uri = lb://AUTHSERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0] = Path=/authservice/**
spring.cloud.gateway.server.webflux.routes[0].filters[0] = StripPrefix=1

spring.cloud.gateway.server.webflux.default-filters[0] = DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
spring.cloud.gateway.server.webflux.default-filters[1] = AddResponseHeader=Access-Control-Expose-Headers,Authorization

resilience4j.ratelimiter.configs.Public-Api.limitForPeriod = 10
resilience4j.ratelimiter.configs.Public-Api.limitRefreshPeriod = 1s
resilience4j.ratelimiter.configs.Public-Api.timeoutDuration = 0

resilience4j.ratelimiter.configs.Protected-Api.limitForPeriod = 15
resilience4j.ratelimiter.configs.Protected-Api.limitRefreshPeriod = 1s
resilience4j.ratelimiter.configs.Protected-Api.timeoutDuration = 0

management.tracing.sampling.probability = 1.0
spring.reactor.context-propagation = auto 

management.endpoint.health.show-details = always
management.endpoints.web.exposure.include = *