spring.application.name = authservice

eureka.instance.hostname = localhost
eureka.instance.prefer-ip-address = true

resilience4j.circuitbreaker.instances.CART-SERVICE.sliding-window-size = 10
resilience4j.circuitbreaker.instances.CART-SERVICE.minimum-number-of-calls = 5
resilience4j.circuitbreaker.instances.CART-SERVICE.failure-rate-threshold = 50
resilience4j.circuitbreaker.instances.CART-SERVICE.wait-duration-in-open-state = 30s
resilience4j.circuitbreaker.instances.CART-SERVICE.permitted-number-of-calls-in-half-open-state = 3

resilience4j.circuitbreaker.instances.COMMENT.sliding-window-size = 10
resilience4j.circuitbreaker.instances.COMMENT.minimum-number-of-calls = 5
resilience4j.circuitbreaker.instances.COMMENT.failure-rate-threshold = 50
resilience4j.circuitbreaker.instances.COMMENT.wait-duration-in-open-state = 30s
resilience4j.circuitbreaker.instances.COMMENT.permitted-number-of-calls-in-half-open-state = 3

resilience4j.circuitbreaker.instances.MailService.sliding-window-size = 10
resilience4j.circuitbreaker.instances.MailService.minimum-number-of-calls = 5
resilience4j.circuitbreaker.instances.MailService.failure-rate-threshold = 50
resilience4j.circuitbreaker.instances.MailService.wait-duration-in-open-state = 30s
resilience4j.circuitbreaker.instances.MailService.permitted-number-of-calls-in-half-open-state = 3

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto = update

spring.datasource.url = jdbc:mysql://localhost:3306/authservice
spring.datasource.username = ${db-username}
spring.datasource.password = ${db-password}

spring.datasource.hikari.maximum-pool-size = 10
spring.datasource.hikari.minimum-idle = 5
spring.datasource.hikari.connection-timeout = 30000
spring.datasource.hikari.idle-timeout = 600000
spring.datasource.hikari.max-lifetime = 1800000

jwt.secret = ${JWT_SECRET}
admin.secret = ${ADMIN_SECRET}
spring.security.oauth2.client.registration.google.client-id = ${google-client-id}
spring.security.oauth2.client.registration.google.client-secret = ${google-client-secret}
spring.security.oauth2.client.registration.google.scope = openid,email,profile
spring.security.oauth2.client.registration.google.authorization-grant-type = authorization_code
server.forward-headers-strategy = framework
spring.security.oauth2.client.registration.google.redirect-uri = http://localhost:8765/authservice/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-name = Google

spring.security.oauth2.client.registration.amazon.client-id = ${amazon-client-id}
spring.security.oauth2.client.registration.amazon.client-secret = ${amazon-client-secret}
spring.security.oauth2.client.registration.amazon.scope = profile
spring.security.oauth2.client.registration.amazon.authorization-grant-type = authorization_code
spring.security.oauth2.client.registration.amazon.redirect-uri = http://localhost:8765/authservice/login/oauth2/code/amazon
spring.security.oauth2.client.registration.amazon.client-name = Amazon

spring.security.oauth2.client.provider.amazon.authorization-uri = https://www.amazon.com/ap/oa
spring.security.oauth2.client.provider.amazon.token-uri = https://api.amazon.com/auth/o2/token
spring.security.oauth2.client.provider.amazon.user-info-uri = https://api.amazon.com/user/profile
spring.security.oauth2.client.provider.amazon.user-name-attribute = user_id

spring.data.redis.host = localhost
spring.data.redis.port = 6379

management.endpoint.health.show-details = always
management.endpoints.web.exposure.include = health,circuitbreakers

resilience4j.timelimiter.instances.MailService.timeout-duration = 5s
resilience4j.timelimiter.instances.MailService.cancel-running-future = true

spring.kafka.bootstrap-servers = localhost:9092 , localhost:9094
spring.kafka.producer.key-serializer = org.apache.kafka.common.serialization.LongSerializer
spring.kafka.producer.value-serializer = org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping = userForgotPasswordRequest:com.example.authservice.model.UserForgotPasswordRequest,users:com.example.authservice.model.Users,admins:com.example.authservice.model.Admins,adminForgotPasswordRequest:com.example.authservice.model.AdminForgotPasswordRequest
