spring.application.name = product-service

server.port = 8090

eureka.instance.hostname = localhost
eureka.instance.prefer-ip-address = true

resilience4j.circuitbreaker.instances.AUTHSERVICE.sliding-window-size = 10
resilience4j.circuitbreaker.instances.AUTHSERVICE.minimum-number-of-calls = 5
resilience4j.circuitbreaker.instances.AUTHSERVICE.failure-rate-threshold = 50
resilience4j.circuitbreaker.instances.AUTHSERVICE.wait-duration-in-open-state = 30s
resilience4j.circuitbreaker.instances.AUTHSERVICE.permitted-number-of-calls-in-half-open-state = 3

resilience4j.circuitbreaker.instances.CART-SERVICE.sliding-window-size = 10
resilience4j.circuitbreaker.instances.CART-SERVICE.minimum-number-of-calls = 5
resilience4j.circuitbreaker.instances.CART-SERVICE.failure-rate-threshold = 50
resilience4j.circuitbreaker.instances.CART-SERVICE.wait-duration-in-open-state = 30s
resilience4j.circuitbreaker.instances.CART-SERVICE.permitted-number-of-calls-in-half-open-state = 3

resilience4j.circuitbreaker.instances.COMMENT.sliding-window-size = 10
resilience4j.circuitbreaker.instances.COMMENT.minimum-number-of-calls = 5
resilience4j.circuitbreaker.instances.COMMENT.failure-rate-threshold = 50
resilience4j.circuitbreaker.instances.COMMENT.wait-duration-in-open-state = 30s
resilience4j.circuitbreaker.instances.COMMENT.permitted-number-of-calls-in-half-open-state = 3

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto = update

spring.datasource.url = jdbc:mysql://localhost:3306/products
spring.datasource.username = ${db-username}
spring.datasource.password = ${db-password}

spring.datasource.hikari.maximum-pool-size = 10
spring.datasource.hikari.minimum-idle = 5
spring.datasource.hikari.connection-timeout = 30000
spring.datasource.hikari.idle-timeout = 600000
spring.datasource.hikari.max-lifetime = 1800000

jwt.secret = ${JWT_SECRET}

spring.data.redis.host = localhost
spring.data.redis.port = 6379

spring.servlet.multipart.max-file-size = 3MB
spring.servlet.multipart.max-request-size = 3MB

spring.kafka.bootstrap-servers = localhost:9092 , localhost:9094
spring.kafka.producer.key-serializer = org.apache.kafka.common.serialization.LongSerializer
spring.kafka.producer.value-serializer = org.springframework.kafka.support.serializer.JacksonJsonSerializer