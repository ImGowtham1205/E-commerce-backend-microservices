spring.application.name = order-service

server.port = 8100

eureka.instance.hostname = localhost
eureka.instance.prefer-ip-address = true

resilience4j.circuitbreaker.instances.AUTHSERVICE.sliding-window-size = 10
resilience4j.circuitbreaker.instances.AUTHSERVICE.minimum-number-of-calls = 5
resilience4j.circuitbreaker.instances.AUTHSERVICE.failure-rate-threshold = 50
resilience4j.circuitbreaker.instances.AUTHSERVICE.wait-duration-in-open-state = 30s
resilience4j.circuitbreaker.instances.AUTHSERVICE.permitted-number-of-calls-in-half-open-state = 3

resilience4j.circuitbreaker.instances.product-service.sliding-window-size = 10
resilience4j.circuitbreaker.instances.product-service.minimum-number-of-calls = 5
resilience4j.circuitbreaker.instances.product-service.failure-rate-threshold = 50
resilience4j.circuitbreaker.instances.product-service.wait-duration-in-open-state = 30s
resilience4j.circuitbreaker.instances.product-service.permitted-number-of-calls-in-half-open-state = 3

resilience4j.circuitbreaker.instances.MailService.sliding-window-size = 10
resilience4j.circuitbreaker.instances.MailService.minimum-number-of-calls = 5
resilience4j.circuitbreaker.instances.MailService.failure-rate-threshold = 50
resilience4j.circuitbreaker.instances.MailService.wait-duration-in-open-state = 30s
resilience4j.circuitbreaker.instances.MailService.permitted-number-of-calls-in-half-open-state = 3

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto = update

spring.datasource.url = jdbc:mysql://localhost:3306/orders
spring.datasource.username = ${db-username}
spring.datasource.password = ${db-password}

spring.datasource.hikari.maximum-pool-size = 10
spring.datasource.hikari.minimum-idle = 5
spring.datasource.hikari.connection-timeout = 30000
spring.datasource.hikari.idle-timeout = 600000
spring.datasource.hikari.max-lifetime = 1800000

jwt.secret = ${JWT_SECRET}

razorpay.client.id = ${razorpay-client-id}
razorpay.client.secret = ${razorpay-client-secret}

spring.data.redis.host = localhost
spring.data.redis.port = 6379

resilience4j.timelimiter.instances.MailService.timeout-duration = 5s
resilience4j.timelimiter.instances.MailService.cancel-running-future = true

spring.kafka.bootstrap-servers = localhost:9092 , localhost:9094
spring.kafka.producer.key-serializer = org.apache.kafka.common.serialization.LongSerializer
spring.kafka.producer.value-serializer = org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping = ordersRequest:com.example.order_service.model.OrdersRequest