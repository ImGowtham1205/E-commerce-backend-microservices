spring.application.name = cart-service

server.port = 8070

eureka.instance.hostname = localhost
eureka.instance.prefer-ip-address = true

resilience4j.circuitbreaker.instances.AUTHSERVICE.sliding-window-size = 10
resilience4j.circuitbreaker.instances.AUTHSERVICE.minimum-number-of-calls = 5
resilience4j.circuitbreaker.instances.AUTHSERVICE.failure-rate-threshold = 50
resilience4j.circuitbreaker.instances.AUTHSERVICE.wait-duration-in-open-state = 30s
resilience4j.circuitbreaker.instances.AUTHSERVICE.permitted-number-of-calls-in-half-open-state = 3

resilience4j.circuitbreaker.instances.product-service.sliding-window-size = 10
resilience4j.circuitbreaker.instances.product-service.minimum-number-of-calls = 5
resilience4j.circuitbreaker.instances.product-service.failure-rate-threshold = 50
resilience4j.circuitbreaker.instances.product-service.wait-duration-in-open-state = 30s
resilience4j.circuitbreaker.instances.product-service.permitted-number-of-calls-in-half-open-state = 3

spring.mongodb.uri = mongodb://localhost:27017/cart-db
spring.mongodb.database = cart-db
spring.data.mongodb.auto-index-creation = true

jwt.secret = ${JWT_SECRET}

spring.data.redis.host = localhost
spring.data.redis.port = 6379

spring.kafka.bootstrap-servers = localhost:9092
spring.kafka.consumer.group-id = cart-service-group
spring.kafka.consumer.auto-offset-reset = earliest

spring.kafka.producer.key-serializer = org.apache.kafka.common.serialization.LongSerializer
spring.kafka.producer.value-serializer = org.springframework.kafka.support.serializer.JacksonJsonSerializer

spring.kafka.consumer.key-deserializer = org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer = org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class = org.apache.kafka.common.serialization.LongDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class = org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages = *